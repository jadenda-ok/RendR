name: Website

on:
  push:
    tags:
      - 'site-*'

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Remove existing v1.1.0 release (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_ID=$(gh api repos/jadenda-ok/RendR/releases/tags/v1.1.0 --jq '.id' 2>/dev/null || echo "")
          if [ -n "$REL_ID" ]; then
            gh api -X DELETE "repos/jadenda-ok/RendR/releases/$REL_ID" >/dev/null 2>&1 || true
          fi

      - name: Publish NSIS release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Build portable and attach
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win portable --publish never
          gh release upload v1.1.0 release/Rendr-Portable-*.exe --clobber

      - name: Finalize release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const md = fs.readFileSync('CHANGELOG.md', 'utf8');
            const sec = md.match(/## \[1\.1\.0\][\s\S]*?(?=\n## |$)/);
            const body = sec ? sec[0].replace(/^## \[1\.1\.0\][^\n]*\n/, '').trim() : 'Rendr v1.1.0';
            const h = { Authorization: 'token ' + process.env.GH_TOKEN, 'User-Agent': 'rendr-ci', Accept: 'application/vnd.github+json' };
            const rel = await fetch('https://api.github.com/repos/jadenda-ok/RendR/releases/tags/v1.1.0', { headers: h }).then(r => r.json());
            if (!rel.id) throw new Error('release not found');
            const res = await fetch('https://api.github.com/repos/jadenda-ok/RendR/releases/' + rel.id, {
              method: 'PATCH',
              headers: h,
              body: JSON.stringify({ name: 'Rendr v1.1.0', body })
            });
            console.log('notes patch:', res.status);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Deploy site to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy Rendr website"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/jadenda-ok/RendR.git" gh-pages

      - name: Enable GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT repos/jadenda-ok/RendR/pages \
            -f source[branch]=gh-pages -f source[path]=/ >/dev/null 2>&1 || true

      - name: Wait for Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 24); do
            ST=$(gh api repos/jadenda-ok/RendR/pages --jq '.status' 2>/dev/null || echo "none")
            echo "pages status: $ST"
            [ "$ST" = "built" ] && exit 0
            sleep 15
          done
          echo "Pages did not finish building in time"
          exit 1
